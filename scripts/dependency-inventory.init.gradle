import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    app.tasks.register('publicDependencyInventory') {
        doLast {
            def modules = app.configurations.getByName('releaseRuntimeClasspath')
                .incoming.resolutionResult.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .collect { [group: it.group, name: it.module, version: it.version] }
                .sort { "${it.group}:${it.name}:${it.version}" }
            def output = new File(app.rootProject.projectDir,
                'build/public-release-audit/dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration: 'releaseRuntimeClasspath', components: modules])) + '\n'
            println "Inventoried ${modules.size()} runtime components in build/public-release-audit/dependencies.json"
        }
    }
}
